# LEDSA 0.13.0, Hasenheide 1, Hep_220_S1_R1 251208_V1_C3 (C3 an F2L, Woche 2); Vorlage aus der Weitergabe 2026-11-19.
# Pfade relativ zu diesem Ordner (configs/<Lauf>/<Serienordner>/). Kantenindizes nach ledsa -s1 eintragen
# (oberste und unterste LED je Streifen, Streifen in der Reihenfolge der Koordinaten); im Bild verdeckte Enden
# nach innen verschieben. Streifen im Blick laut Labbook; ob alle im Bild sind, je Serie pruefen.
# Streifen: LED 3, LED 3.1, LED 3.2
[DEFAULT]
# variables used in multiple parts of ledsa.
   # directory where the images for one experiment are stored.
   img_directory = ../../../Hep_220_S1_R1/3_LEDSA/251208_V1_C3/
   # string representing the naming convention of the image files.
   img_name_string = DSC_{:04d}.CR3
   # maximum number of image counter.
   num_img_overflow = 9999
   # degrees the images have to be turned clockwise to be upright, for photos
   # taken with the camera on its side: 0, 90, 180 or 270. "auto" takes the
   # rotation from the metadata of every image, which is what cameras store.
   img_rotation = auto
# specify which images ar part of the experiment by image indices.
   first_img_experiment_id = 37
   last_img_experiment_id = 418
   # number of cpus, multicore processing is applied if > 1.
   num_cores = 4

# variables used to calculate the timeline of the experiment.
   # date of the experiment.
   date = 08.12.2025
   # beginning of the experiment, will be calculated from image with first_img_experiment_id if none.
   start_time = 15:01:00
   # id of time reference image name with a clock to calculate the offset of the camera time. can be none,
   # if time_diff_to_img_time in seconds is given. you might also use time_ref_img_file instead.
   time_ref_img_id = None
   # path of time reference image with a clock to calculate the offset of the camera time. can be none,
   # if time_diff_to_img_time in seconds is given. you might also use time_ref_img_id instead.
   time_ref_img_file = None
   # time shown on the time reference image
   time_ref_img_time = None
   # seconds the camera clock is ahead of the real time. decimals are allowed.
   exif_time_infront_real_time = 0

[find_search_areas]
# variables used to find the pixel positions of every led.
   # id of reference image used to find and label the leds.
   ref_img_id = 46
   # threshold percentile of pixel value to find leds on the reference image.
   pixel_value_percentile = 99.875
   # camera channel on which leds should be found, "all" only works for raw image files
   channel = all
   # radius of pixels assigned to each led
   search_area_radius = 10
   # maximum number of leds to detect on the reference image
   max_num_leds = 1300

[analyse_positions]
# variables used to find the physical positions of every led
   # number of led arrays
   num_arrays = 3
# indices of leds to be ignored in further analysis
   ignore_led_indices = None
   # pairs of led indices of the edges of each led array
   led_array_edge_indices = 
   # six coordinates per led array representing the physical positions of the
   # edges given in led_array_edge_indices.
   led_array_edge_coordinates = 
	    4.52 7.37 2.535 4.52 7.37 0.055
	    4.478 7.232 2.535 4.478 7.232 0.1
	    4.478 7.21 2.535 4.478 7.21 0.1
   # indices of the led arrays to merge for further analysis.
   merge_led_array_indices = None

[analyse_photo]
# variables used for the final fitting of the intensity function.
 
# specify which images are used for analysis by image indices.
   first_img_analysis_id = 37
   last_img_analysis_id = 418
   # in the analysis, only images are considered with id dividable by skip_imgs + 1.
   num_skip_imgs = 0
   # experiment ids of the images the led intensities are normalized with,
   # separated by spaces. they are analysed whatever num_skip_imgs leaves out
   # and are never summarized by average_images, so that the reference window
   # keeps the time span it is meant to have. none: the analysis takes its reference images
   # from num_ref_images or ref_img_indices of config_analysis.ini.
   ref_img_experiment_ids = None
   # in the analysis, only leds are considered with id dividable by skip_leds + 1.
   num_skip_leds = 0
   # pedestal of the search areas from the far field of the led strips (farbg_sum_col_val):
   # inner and outer distance in pixels across the strip of the bands on both of its sides,
   # e.g. 150 300. the bands have to lie beyond the light of the leds and of their halo.
   # none: no pedestal is estimated.
   farfield_distances = 150 300

