[DEFAULT]
# variables used in multiple parts of ledsa
   # number of cpus, multicore processing is applied if > 1
   num_cores = 8
   # quantities the extinction coefficients are computed from, separated by spaces
   reference_property = farbg_sum_col_val sum_col_val
   # number images used to compute normalize led intensities
   num_ref_images = 10
   # indices of reference images to use
   ref_img_indices = 19 20 21 22 23 24 25 26 27 29
   # camera channels to be considered in the analysis
   camera_channels = 0 1 2
   # intensities are computed as average from n_summarize consecutive images if set to true 
   average_images = False
   # number of consecutive images summarized into one, the reference images excluded 
   n_summarize = 2
   # extinction coefficients can be computed by linear or numeric solver 
   solver = linear
   # options for nonlinear solver (ignored when linear solver is used) 
   weighting_preference = -0.006
   weighting_curvature = 0.01
   num_iterations = 1000
   # options for linear solver (ignored when nonlinear solver is used) 
   lambda_reg = 0.5

[experiment_geometry]
# global x y z position of the camera 
   camera_position = -0.181 12.527 1.053
   # distance [m] between the camera and the window pane it looks through into the
   # smoke, none without a pane. the pane is taken as normal to the line of sight:
   # the first pane_distance of every line of sight is free of smoke, so only the
   # part behind the pane is distributed over the layers.
   pane_distance = 0.186

[model_parameters]
# parameters regarding the discretization of the spatial domain 
   # led arrays for that the extinction coefficients should be computed  
   led_array_indices = 0 1 2
   # number of horizontal smoke layers  
   num_layers = 25
   # lower and upper bounds of the computational domain  
   domain_bounds = 0.0 2.535

[temperature_correction]
# correction of the led intensities for the temperature of the leds.
   # path of the reduction factor file of every camera channel. a channel with a
   # file is corrected with it, a channel set to none is analysed as extracted.
   # the factors are computed outside ledsa and read from a csv file holding the
   # experiment time [s] in its first column, the led height [m] in its header
   # and the factor the intensity of that time and height is reduced by in its
   # cells. they are interpolated to the time of every image and the height of
   # every led, and the intensities are divided by them.
   reduction_file_channel_0 = None
   reduction_file_channel_1 = None
   reduction_file_channel_2 = None

